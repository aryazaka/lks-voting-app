version: "3.9"

services:
  redis:
    image: redis:alpine
    networks:
      - frontend
    deploy:
      placement:
        constraints: [node.role == worker]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      placement:
        constraints: [node.role == worker]

  vote:
    image: 537124946916.dkr.ecr.us-east-1.amazonaws.com/lks-voting-image:vote-dev-latest
    ports:
      - 5000:80
    networks:
      - frontend
    deploy:
      replicas: 3
      placement:
        constraints: [node.role == manager]

  result:
    image: 537124946916.dkr.ecr.us-east-1.amazonaws.com/lks-voting-image:result-dev-latest
    ports:
      - 5001:80
    networks:
      - backend
    deploy:
      replicas: 3
      placement:
        constraints: [node.role == manager]

  worker:
    image: 537124946916.dkr.ecr.us-east-1.amazonaws.com/lks-voting-image:worker-dev-latest
    networks:
      - frontend
      - backend
    deploy:
      replicas: 3
      placement:
        constraints: [node.role == manager]

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay

volumes:
  db-data:
